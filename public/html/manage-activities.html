<!-- html/manage-activities.html -->
<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理活动 - 创客社</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="../css/font/iconfont.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <script src="../js/theme-change.js"></script>
  <style>
    .container {
      padding: 2rem;
    }
    .activity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #eee;
    }
    .activity-info {
      flex: 1;
    }
    .activity-actions {
      display: flex;
      gap: 0.5rem;
    }
    .button.is-small {
      font-size: 0.8rem;
    }
    .button.is-static {
      pointer-events: none;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <script src="../js/load-header.js"></script>

  <section class="container">
    <h1 class="title">管理活动</h1>
    <p class="subtitle">创建、编辑、删除社团活动</p>
    <button class="button is-success mb-4" onclick="createNewActivity()">➕ 新建活动</button>
    <div id="activities-list">
      <p>加载中...</p>
    </div>
  </section>

  <script>
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;');
    }

    let currentUser = null;

    async function checkLogin() {
      try {
        const res = await fetch('/api/account', { credentials: 'include' });
        if (!res.ok) throw new Error('未登录');
        currentUser = await res.json();
        if (!currentUser.role) {
          alert('用户信息不完整，无法加载');
          return false;
        }
        return true;
      } catch (err) {
        alert('请先登录');
        const returnTo = encodeURIComponent(window.location.href);
        window.location.href = `/html/login.html?returnTo=${returnTo}`;
        return false;
      }
    }

    async function loadActivities() {
      if (!currentUser) return;
      try {
        const res = await fetch('/api/activities');
        if (!res.ok) throw new Error('获取活动列表失败');
        const activities = await res.json();
        const container = document.getElementById('activities-list');
        container.innerHTML = '';
        if (activities.length === 0) {
          container.innerHTML = '<p>暂无活动</p>';
          return;
        }
        activities.forEach(activity => {
          const isOwner = Number(activity.author_id) === Number(currentUser.id);
          const canEdit = isOwner || currentUser.role === 'admin';
          const titleEscaped = escapeHtml(activity.title);
          const authorName = escapeHtml(activity.author?.username || '未知用户');
          const authorEmail = activity.author.email;
          const authorGraduationYear = activity.author.graduation_year;
          const div = document.createElement('div');
          div.className = 'activity-item';
          div.innerHTML = `
            <div class="activity-info">
              <strong>${titleEscaped}</strong>
              <br/>
              <small>By&nbsp;&nbsp;<a class="strong" href="mailto:${authorEmail}" title="给${authorGraduationYear}届的 ${authorName} 发邮件">${authorName}</a></small>
            </div>
            <div class="activity-actions">
              <button class="button is-small is-warning ${canEdit ? '' : 'is-static'}" 
                      ${canEdit ? '' : 'disabled'} 
                      onclick="editActivity(${activity.id})">编辑</button>
              <button class="button is-small is-danger ${canEdit ? '' : 'is-static'}" 
                      ${canEdit ? '' : 'disabled'} 
                      onclick="deleteActivity(${activity.id}, '${titleEscaped}')">删除</button>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        document.getElementById('activities-list').innerHTML = `<p>加载失败：${escapeHtml(err.message)}</p>`;
      }
    }

    function createNewActivity() {
      window.location.href = '/html/edit-activity.html?new=1';
    }

    function editActivity(id) {
      window.location.href = `/html/edit-activity.html?id=${id}`;
    }

    async function deleteActivity(id, title) {
      if (!confirm(`确定要删除活动《${title}》吗？`)) return;
      try {
        const res = await fetch(`/api/activity/${id}`, {
          method: 'DELETE',
          credentials: 'include'
        });
        if (res.ok) {
          alert('删除成功');
          loadActivities();
        } else {
          const err = await res.json();
          alert(err.message || '删除失败');
        }
      } catch (err) {
        alert('网络错误，删除失败');
      }
    }

    (async () => {
      const isLoggedIn = await checkLogin();
      if (isLoggedIn) {
        await loadActivities();
      }
    })();
  </script>

  <!-- 页脚 -->
  <script src="../js/load-footer.js"></script>
</body>
</html>
