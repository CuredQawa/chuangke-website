<!DOCTYPE html>
<html lang="zh" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活动详情 - 创客社</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="../css/font/iconfont.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/document.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <script src="../js/theme-change.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.1.1/lib/marked.umd.min.js"></script>
  <style>
    .container {
      padding: 2rem;
    }

    .back-link {
      margin-bottom: 1rem;
      display: inline-block;
    }
  </style>
</head>

<body>

  <!-- 导航栏 -->
  <script src="../js/load-header.js"></script>

  <!-- 上滑浏览按钮 -->
  <button id="toTop" class="button is-success is-medium 
    is-fixed-bottom-right-for-new-slide-button is-purple" style="display: none;">
    <span class="icon"><i class="iconfont icon-xiangshang"></i></span>
  </button>

  <!-- 平滑滚动脚本 -->
  <script>
    function scrollToTop() {
      var timer = setInterval(function () {
        var distanceY = document.documentElement.scrollTop || document.body.scrollTop;
        if (distanceY == 0) {
          clearInterval(timer);
          return;
        }

        // 调整上划速度（speed）两个一起改
        var speed = Math.ceil(distanceY / 10);
        document.documentElement.scrollTop = distanceY - speed;
      }, 10);
    }
  </script>
  <script>
    var toTop = document.querySelector("#toTop");
    window.addEventListener("scroll", function () {
      var distanceY = document.documentElement.scrollTop || document.body.scrollTop;
      if (distanceY > 50) {
        toTop.style.display = "block";
      } else {
        toTop.style.display = "none";
      }
    });

    toTop.addEventListener("click", function () {
      var timer = setInterval(function () {
        var distanceY = document.documentElement.scrollTop || document.body.scrollTop;
        if (distanceY == 0) {
          clearInterval(timer);
          return;
        }

        // 调整上划速度（speed）两个一起改
        var speed = Math.ceil(distanceY / 10);
        document.documentElement.scrollTop = distanceY - speed;
      }, 10);
    });
  </script>

  <section class="container">
    <a href="/html/activity.html" class="back-link">&larr; 返回活动首页</a>
    <div id="content">
      <p>加载中...</p>
    </div>
  </section>

  <!-- 页脚 -->
  <script src="../js/load-footer.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function loadActivity() {
      if (!id) {
        document.getElementById('content').innerHTML = '<div class="notification is-danger">无效的活动ID</div>';
        return;
      }

      try {
        const res = await fetch(`/api/activity/${id}`);
        if (!res.ok) throw new Error('活动不存在');

        const data = await res.json();
        document.getElementById('content').innerHTML = `
          <h1 class="title">${data.title}</h1>
          <hr/>
          <div class="content">${marked.parse(data.content)}</div>
          <hr/>
          <p class="administrator">By&nbsp;&nbsp;<a class="strong" href="mailto:${data.author.email}">${data.author.username}</a></p>
          <p class="date">${new Date(data.datetime).toLocaleString()}</p>
        `;

        // 初始化代码高亮和复制按钮
        if (typeof window.initCodeHighlighting === 'function') {
          window.initCodeHighlighting();
        } else {
          // 如果 initCodeHighlighting 函数尚未定义，等待其定义后再调用
          const checkInit = setInterval(() => {
            if (typeof window.initCodeHighlighting === 'function') {
              clearInterval(checkInit);
              window.initCodeHighlighting();
            }
          }, 100);
        }
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="notification is-danger">加载失败：${err.message}</div>
        `;
      }
    }

    loadActivity();
  </script>
</body>

</html>
