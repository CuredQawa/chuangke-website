<!DOCTYPE html>
<html lang="zh" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公告栏-创客社</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="../css/font/iconfont.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/announcement.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <script src="../js/theme-change.js"></script>
</head>

<body>

  <!-- 导航栏 -->
  <script src="../js/load-header.js"></script>

  <!-- 上滑浏览按钮 -->
  <button id="toTop" class="button is-success is-medium 
  is-fixed-bottom-right-for-new-slide-button is-purple" style="display: none;">
    <span class="icon"><i class="iconfont icon-xiangshang"></i></span>
  </button>

  <!-- 平滑滚动脚本 -->
  <script>
    var toTop = document.querySelector("#toTop");
    window.addEventListener("scroll", function() {
    var distanceY = document.documentElement.scrollTop || document.body.scrollTop;
    if (distanceY > 50) {
    toTop.style.display = "block";
    } else {
    toTop.style.display = "none";
    }
    });
    
    toTop.addEventListener("click", function() {
    var timer = setInterval(function() {
    var distanceY = document.documentElement.scrollTop || document.body.scrollTop;
    if (distanceY == 0) {
    clearInterval(timer);
    return;
    }

    // 调整上划速度（speed）两个一起改
    var speed = Math.ceil(distanceY / 10);
    document.documentElement.scrollTop = distanceY - speed;
    }, 10);
    });
  </script>
  


  <!-- 管理员专用：发布公告按钮 -->
  <button id="manage-announcements-btn" class="button is-success is-medium is-fixed-bottom-right is-purple"
    style="display: none;" onclick="gotoManageAnnouncements()">
    <span class="icon">
      <i class="iconfont icon-xitongguanli"></i>
    </span>
  </button>

  <section class="section">
    <div id="div1" class="frontboard has-text-centered">
      <h1 class="title btitle">创客社公告栏</h1>
      <div id="announcements-container" class="container"></div>
      <div class="containner ccontainner has-text-right">
        <p class="subtitle">————湛江一中创客社</p>
      </div>
    </div>
  </section>

  <script>
    // 检查是否为管理员，决定是否显示按钮
    async function checkAdmin() {
      try {
        const res = await fetch('/api/account', {
          credentials: 'include'
        });
        if (res.ok) {
          const user = await res.json();
          if (user.role === 'admin') {
            document.getElementById('manage-announcements-btn').style.display = 'inline-block';
          }
        }
      } catch (err) {
        console.error('检查管理员身份失败', err);
      }
    }

    // 跳转到管理页面
    function gotoManageAnnouncements() {
      window.location.href = '/html/manage-announcements.html';
    }

    // 加载公告列表
    document.addEventListener("DOMContentLoaded", async () => {
      await checkAdmin(); // 检查权限并显示按钮

      const container = document.getElementById("announcements-container");
      try {
        const res = await fetch('/api/announcements');
        const data = await res.json();

        data.forEach(announcement => {
          const div = document.createElement('div');
          div.className = 'announcement';
          div.innerHTML = `
            <p class="titlep">${announcement.title}</p>
            <p class="contentp">${announcement.content.replace(/\n/g, '<br>')}</p>
            <p class="administrator">By&nbsp;&nbsp;<a class="strong" href="mailto:${announcement.author.email}" title="给${announcement.author.graduation_year}届的 ${announcement.author?.username || '未知用户'} 发邮件">${announcement.author?.username || '未知用户'}</a></p>
            <p class="date">${new Date(announcement.datetime).toLocaleString()}</p>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        console.error('加载公告失败', err);
        container.innerText = '无法加载公告信息';
      }
    });
  </script>

  <!-- 页脚 -->
  <script src="../js/load-footer.js"></script>

</body>

</html>
