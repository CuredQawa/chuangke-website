<!-- html/manage-docs.html -->
<!DOCTYPE html>
<html lang="zh" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理文档 - 湛江一中创客社</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="../css/font/iconfont.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <script src="../js/theme-change.js"></script>
  <style>
    .container {
      padding: 2rem;
    }

    .doc-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #eee;
    }

    .doc-info {
      flex: 1;
    }

    .doc-actions {
      display: flex;
      gap: 0.5rem;
    }

    .button.is-small {
      font-size: 0.8rem;
    }

    .button.is-static {
      pointer-events: none;
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <!-- 导航栏 -->
  <script src="../js/load-header.js"></script>

  <section class="container">
    <h1 class="title">管理文档</h1>
    <p class="subtitle">创建、编辑、删除你的文档</p>

    <!-- 新建按钮 -->
    <button class="button is-success mb-4" onclick="createNewDoc()">➕ 新建文档</button>

    <!-- 文档列表 -->
    <div id="docs-list">
      <p>加载中...</p>
    </div>
  </section>

  <script>
    // ========== 工具函数 ==========
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;');
    }

    // ========== 全局变量 ==========
    let currentUser = null;

    // ========== 检查登录状态 ==========
    async function checkLogin() {
      try {
        const res = await fetch('/api/account', { credentials: 'include' });
        if (!res.ok) throw new Error('未登录');
        currentUser = await res.json();

        // 验证 role 是否存在
        if (!currentUser.role) {
          console.error('用户信息缺少 role 字段，请检查后端 /api/account 是否返回 role');
          alert('用户信息不完整，无法加载');
          return false;
        }

        return true;
      } catch (err) {
        console.error('登录检查失败', err);
        alert('请先登录');
        const returnTo = encodeURIComponent(window.location.href);
        window.location.href = `/html/login.html?returnTo=${returnTo}`;
        return false;
      }
    }

    // ========== 加载文档列表 ==========
    async function loadDocs() {
      if (!currentUser) {
        console.error('currentUser 未定义');
        return;
      }

      try {
        const docsRes = await fetch('/api/docs');
        if (!docsRes.ok) throw new Error('获取文档列表失败');

        const docs = await docsRes.json();
        const container = document.getElementById('docs-list');
        container.innerHTML = '';

        if (docs.length === 0) {
          container.innerHTML = '<p>暂无文档</p>';
          return;
        }

        docs.forEach(doc => {
          // 使用 role 判断管理员权限
          const isOwner = Number(doc.author_id) === Number(currentUser.id);
          const isAuthor = currentUser.role === 'admin';
          const canEdit = isOwner || isAuthor; // 管理员可以操作所有文档

          const titleEscaped = escapeHtml(doc.title);
          const authorName = escapeHtml(doc.author?.username || '未知用户');
          const datetime = new Date(doc.datetime).toLocaleString();
          const authorEmail = doc.author.email;
          const authorGraduationYear = doc.author.graduation_year;

          const div = document.createElement('div');
          div.className = 'doc-item';
          div.innerHTML = `
            <div class="doc-info">
              <strong>${titleEscaped}</strong>
              <br/>
              <small>By&nbsp;&nbsp;<a class="strong" href="mailto:${authorEmail}" title="给${authorGraduationYear}届的 ${authorName} 发邮件">${authorName}</a></small>
            </div>
            <div class="doc-actions">
              <button class="button is-small is-warning ${canEdit ? '' : 'is-static'}" 
                      ${canEdit ? '' : 'disabled'} 
                      onclick="editDoc(${doc.id})" title="${canEdit ? '' : '权限不足'}">编辑</button>
              <button class="button is-small is-danger ${canEdit ? '' : 'is-static'}" 
                      ${canEdit ? '' : 'disabled'} 
                      onclick="deleteDoc(${doc.id}, '${titleEscaped}')" title="${canEdit ? '' : '权限不足'}">删除</button>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        console.error('加载文档失败', err);
        document.getElementById('docs-list').innerHTML = `
          <p>加载失败：${escapeHtml(err.message)}</p>
        `;
      }
    }

    // ========== 新建文档 ==========
    function createNewDoc() {
      window.location.href = '/html/edit-doc.html?new=1';
    }

    // ========== 编辑文档 ==========
    function editDoc(id) {
      window.location.href = `/html/edit-doc.html?id=${id}`;
    }

    // ========== 删除文档 ==========
    async function deleteDoc(id, title) {
      if (!confirm(`确定要删除文档《${title}》吗？`)) return;

      try {
        const res = await fetch(`/api/doc/${id}`, {
          method: 'DELETE',
          credentials: 'include'
        });

        if (res.ok) {
          alert('删除成功');
          loadDocs();
        } else {
          const data = await res.json();
          alert(data.message || '删除失败');
        }
      } catch (err) {
        alert('网络错误，删除失败');
      }
    }

    // ========== 初始化 ==========
    (async () => {
      const isLoggedIn = await checkLogin();
      if (isLoggedIn) {
        await loadDocs();
      }
    })();
  </script>

  <!-- 页脚 -->
  <script src="../js/load-footer.js"></script>
</body>

</html>
