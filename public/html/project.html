<!-- html/project.html -->
<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目-创客社</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="../css/font/iconfont.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/document.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <script src="../js/theme-change.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.1.1/lib/marked.umd.min.js"></script>
</head>
<body>
  <!-- 导航栏 -->
  <script src="../js/load-header.js"></script>

  <!-- 管理项目按钮 -->
  <button id="manage-projects-btn" class="button is-success is-medium is-fixed-bottom-right is-perple"
    style="display: none;" onclick="gotoManageProjects()">
    <span class="icon"><i class="iconfont icon-xitongguanli"></i></span>
  </button>

  <br>

  <section class="container">
    <h1 class="title has-text-centered">🚀 项目中心</h1>
    <div class="columns">
      <div class="column is-one-third menu-column">
        <aside class="menu">
          <p class="menu-label">项目列表</p>
          <ul class="menu-list" id="project-menu">
            <li><a>加载中...</a></li>
          </ul>
        </aside>
      </div>
      <div class="column">
        <div id="content">
          <p>请选择左侧项目以查看内容。</p>
        </div>
      </div>
    </div>
  </section>

  <br><br><br><br>

  <script>
    let projects = [];
    let currentProject = null;

    function extractTitle(mdText) {
      const match = mdText.trim().match(/^#\s+(.+)$/m);
      return match ? match[1].trim() : '未命名项目';
    }

    async function loadProject(id, index) {
      const menuItems = document.querySelectorAll('#project-menu a');
      menuItems.forEach(item => item.classList.remove('is-active'));
      if (menuItems[index]) menuItems[index].classList.add('is-active');

      try {
        const res = await fetch(`/api/project/${id}`);
        const data = await res.json();
        document.getElementById('content').innerHTML = `
          <h2 class="title">${data.title}</h2>
          <hr/>
          <div class="content">${marked.parse(data.content)}</div>
          <hr/>
          <p class="administrator">By&nbsp;&nbsp;<a class="strong" href="mailto:${data.author.email}" title="给${data.author.graduation_year}届的 ${data.author?.username || '未知用户'} 发邮件">${data.author?.username || '未知用户'}</a></p>
          <p class="date">${new Date(data.datetime).toLocaleString()}</p>
        `;
        history.pushState(null, '', `?project=${id}`);
        currentProject = id;
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="notification is-danger">加载失败：${err.message}</div>
        `;
      }
    }

    async function fetchProjectsList() {
      try {
        const res = await fetch('/api/projects');
        projects = await res.json();
        if (projects.length === 0) {
          document.getElementById('project-menu').innerHTML = '<li><a>暂无项目</a></li>';
          return;
        }
        const menuEl = document.getElementById('project-menu');
        menuEl.innerHTML = '';
        projects.forEach((project, index) => {
          const a = document.createElement('a');
          a.href = '#';
          a.textContent = project.title;
          a.addEventListener('click', (e) => {
            e.preventDefault();
            loadProject(project.id, index);
          });
          const li = document.createElement('li');
          li.appendChild(a);
          menuEl.appendChild(li);
        });
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('project');
        const index = projects.findIndex(p => p.id == projectId);
        const loadIndex = index >= 0 ? index : 0;
        loadProject(projects[loadIndex].id, loadIndex);
      } catch (err) {
        console.error('加载项目列表失败', err);
        document.getElementById('project-menu').innerHTML = '<li><a>加载失败</a></li>';
      }
    }

    async function checkLogin() {
      try {
        const res = await fetch('/api/account', { credentials: 'include' });
        if (res.ok) {
          document.getElementById('manage-projects-btn').style.display = 'inline-block';
        }
      } catch (err) {
        console.error('检查登录状态失败', err);
      }
    }

    function gotoManageProjects() {
      window.location.href = '/html/manage-projects.html';
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await checkLogin();
      fetchProjectsList();
      window.addEventListener('popstate', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('project');
        const index = projects.findIndex(p => p.id == projectId);
        if (index >= 0 && projectId !== currentProject) {
          loadProject(projectId, index);
        }
      });
    });
  </script>

  <!-- 页脚 -->
  <script src="../js/load-footer.js"></script>
</body>
</html>
