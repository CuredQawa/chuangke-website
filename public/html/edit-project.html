<!-- html/edit-project.html -->
<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑项目 - 创客社</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="../css/font/iconfont.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <script src="../js/theme-change.js"></script>
  <style>
    .container {
      padding: 2rem;
    }
    .editor-container {
      display: flex;
      gap: 2rem;
      height: calc(100vh - 120px);
    }
    .editor-left,
    .editor-right {
      flex: 1;
      padding: 1rem;
    }
    #content-input {
      width: 100%;
      height: 100%;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      resize: none;
      background: var(--preview-bg);
      color: var(--content-color);
    }
    #preview {
      height: 100%;
      overflow-y: auto;
      padding: 1rem;
      border-radius: 8px;
      background: var(--preview-bg);
    }
    .mt-4 {
      padding: 1rem;
      display: flex;
      justify-content: end;
      gap: 1rem;
    }

    /* ========== 新增：Markdown 预览样式 ========== */
    .markdown-content h1, .markdown-content h2, .markdown-content h3,
    .markdown-content h4, .markdown-content h5, .markdown-content h6 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      color: #333;
      font-weight: 600;
    }
    .markdown-content h1 { font-size: 2em; }
    .markdown-content h2 { font-size: 1.75em; }
    .markdown-content h3 { font-size: 1.5em; }
    .markdown-content h4 { font-size: 1.25em; }
    .markdown-content h5 { font-size: 1.1em; }
    .markdown-content h6 { font-size: 1em; color: #666; }

    .markdown-content p {
      margin: 0.8em 0;
      line-height: 1.6;
    }

    .markdown-content ul, .markdown-content ol {
      margin: 0.8em 0;
      padding-left: 2em;
    }

    .markdown-content blockquote {
      margin: 1em 0;
      padding: 0.5em 1em;
      border-left: 4px solid #a654f1;
      background: #f0f0f0;
      color: #555;
    }

    .markdown-content code {
      padding: 0.2em 0.4em;
      background: #eee;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }

    .markdown-content pre {
      margin: 1em 0;
      padding: 1rem;
      background: #3a3a3a;
      color: #eee;
      border-radius: 6px;
      overflow-x: auto;
    }

    .markdown-content img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 1em 0;
    }

    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
    }

    .markdown-content th, .markdown-content td {
      padding: 0.5em;
      border: 1px solid #ccc;
      text-align: left;
    }

    [data-theme=light],
    .theme-light {
      :root {
        --content-color: #555;
        --preview-bg: #f9f9f9;
      }
    }

    [data-theme=dark],
    .theme-dark {
      :root {
        --content-color: #eee;
        --preview-bg: #2a2a2a;
      }
      .markdown-content h1, .markdown-content h2, .markdown-content h3,
      .markdown-content h4, .markdown-content h5, .markdown-content h6 {
        color: #eee;
      }
      .markdown-content p, .markdown-content li, .markdown-content blockquote {
        color: #ddd;
      }
      .markdown-content blockquote {
        background: #3a3a3a;
        border-left-color: #a654f1;
      }
      .markdown-content code {
        background: #4a4a4a;
        color: #fff;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.1.1/lib/marked.umd.min.js"></script>
</head>
<body>

  <!-- 导航栏 -->
  <script src="../js/load-header.js"></script>

  <div class="container">
    <h1 class="title" id="page-title">新建项目</h1>
    <form id="project-form">
      <div class="field">
        <label class="label">项目标题</label>
        <div class="control">
          <input class="input" type="text" id="title-input" required>
        </div>
      </div>
      <div class="editor-container">
        <div class="editor-left">
          <label class="label">Markdown 原文</label>
          <textarea id="content-input" placeholder="输入 Markdown 内容..."></textarea>
        </div>
        <div class="editor-right">
          <label class="label">预览</label>
          <div id="preview" class="markdown-content"></div>
        </div>
      </div>
      <div class="field mt-4">
        <button type="submit" class="button is-success">提交</button>
        <a href="/html/manage-projects.html" class="button is-light">取消</a>
      </div>
    </form>
  </div>

  <!-- 页脚 -->
  <script src="../js/load-footer.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');
    const isNew = urlParams.get('new');
    const form = document.getElementById('project-form');
    const titleInput = document.getElementById('title-input');
    const contentInput = document.getElementById('content-input');
    const preview = document.getElementById('preview');
    const pageTitle = document.getElementById('page-title');

    // 实时预览 + 提取头图
    function updatePreview() {
      const content = contentInput.value;
      preview.innerHTML = marked.parse(content);

      // 提取第一张图片 URL
      const imgMatch = content.match(/!\[.*?\]\((.*?)\)/);
      const cover_image_url = imgMatch ? imgMatch[1].trim() : null;
      window.currentCoverImageUrl = cover_image_url;
    }

    contentInput.addEventListener('input', updatePreview);

    // 提交项目
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = titleInput.value.trim();
      const content = contentInput.value;

      if (!title) {
        alert('请输入标题');
        return;
      }

      if (!content.trim()) {
        alert('内容不能为空');
        return;
      }

      // 提取第一张图片作为 cover_image_url
      const imgMatch = content.match(/!\[.*?\]\((.*?)\)/);
      const cover_image_url = imgMatch ? imgMatch[1].trim() : null;

      const data = {
        title,
        content,
        cover_image_url
      };

      let url, method;
      if (isNew) {
        url = '/api/project';
        method = 'POST';
      } else {
        url = `/api/project/${projectId}`;
        method = 'PUT';
      }

      try {
        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data),
          credentials: 'include'
        });

        if (res.ok) {
          alert(isNew ? '项目创建成功' : '项目更新成功');
          window.location.href = '/html/manage-projects.html';
        } else {
          const err = await res.json();
          alert('❌ ' + (err.message || '操作失败'));
        }
      } catch (err) {
        alert('❌ 网络错误，提交失败：' + err.message);
      }
    });

    // 加载项目（编辑模式）
    async function loadProject() {
      if (!projectId) return;
      try {
        const res = await fetch(`/api/project/${projectId}`);
        const data = await res.json();
        titleInput.value = data.title;
        contentInput.value = data.content;
        updatePreview(); // 触发预览和头图提取
        pageTitle.textContent = `编辑项目：${data.title}`;
      } catch (err) {
        alert('加载项目失败');
        window.location.href = '/html/manage-projects.html';
      }
    }

    // 初始化
    (async () => {
      if (projectId) {
        await loadProject();
      } else if (isNew) {
        contentInput.value = '# 新项目\n\n请输入内容...';
        updatePreview();
      } else {
        window.location.href = '/html/manage-projects.html';
      }
    })();
  </script>
</body>
</html>
